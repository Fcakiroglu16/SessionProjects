<text x="50" y="74" font-size="42" font-weight="800" fill="#1f2937">Case Summary Agent — Decision Support, Not Automation</text>
<text x="50" y="112" font-size="21" fill="#6b7280">The agent reads the request, gathers facts with read-only tools, applies policy via skills, and recommends an action. A human decides.</text>
