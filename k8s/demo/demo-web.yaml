# KubernetesAgent'ın onaylı aksiyonunu (kubernetes_restart_deployment) denemek için demo uygulaması.
#   kubectl --context docker-desktop apply -f k8s/demo/demo-web.yaml
#   kubectl --context docker-desktop delete namespace sessionprojects-demo
apiVersion: v1
kind: Namespace
metadata:
  name: sessionprojects-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: sessionprojects-demo
  labels:
    app: demo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
