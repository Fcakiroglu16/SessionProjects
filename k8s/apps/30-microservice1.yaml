apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice1-api
  namespace: sessionprojects
  labels:
    app: microservice1-api
    app.kubernetes.io/part-of: sessionprojects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice1-api
  template:
    metadata:
      labels:
        app: microservice1-api
        app.kubernetes.io/part-of: sessionprojects
    spec:
      containers:
        - name: microservice1-api
          # compose.yaml ile build edilen local image (Docker Desktop containerd image store'dan gelir).
          # Always: aynı :latest tag'iyle yeniden build edilince node'daki eski kopya yerine yenisi alınır.
          image: microservice1.api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Telemetry: otel-collector -> log/trace SigNoz, metric Prometheus
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: OTEL_SERVICE_NAME
              value: microservice1-api
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            # Aspire.RabbitMQ.Client bu connection string'i okur (AppHost'taki WithReference(rabbitmq) karşılığı)
            - name: ConnectionStrings__rabbitmq
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672
            # Aspire service discovery karşılığı: https+http://microservice2-api -> Kubernetes Service adı
            - name: services__microservice2-api__http__0
              value: http://microservice2-api:8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: microservice1-api
  namespace: sessionprojects
  labels:
    app: microservice1-api
spec:
  selector:
    app: microservice1-api
  ports:
    - name: http
      port: 8080
      targetPort: http
